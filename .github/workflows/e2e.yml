# Toolshop E2E — hermetic CI
#
# The public demo serves a Cloudflare human-verification challenge to datacenter
# IPs, so browser tests cannot target it from GitHub-hosted runners. CI therefore
# boots the application under test inside the runner (upstream prebuilt images)
# and runs the suite against localhost.
#
# - push/PR: smoke suite (chromium)
# - nightly (01:25 UTC) + manual: full suite; HTML report published to GitHub Pages
name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '25 1 * * *'
  workflow_dispatch:

env:
  # 127.0.0.1: on the runner, localhost can resolve to ::1 and miss Docker's IPv4 port binding
  BASE_URL: http://127.0.0.1:4200
  API_URL: http://127.0.0.1:8091
  DISABLE_LOGGING: 'true'

jobs:
  smoke:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out the application under test
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: sut
      # The upstream web (nginx) image is published arm64-only and crashes on the
      # x86_64 runner (exec format error); QEMU emulation handles it transparently.
      - uses: docker/setup-qemu-action@v3
      - name: Start the application (prebuilt images)
        working-directory: sut
        run: docker compose -f docker-compose.prod.yml up --pull missing -d
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Seed the database
        working-directory: sut
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml exec -T laravel-api php artisan migrate:fresh --seed; then exit 0; fi
            sleep 5
          done
          echo "database seed failed"
          docker compose -f docker-compose.prod.yml logs --tail 80
          exit 1
      - name: Wait for API and UI
        working-directory: sut
        run: |
          ok=0
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8091/status > /dev/null && ok=1 && break; sleep 3; done
          if [ "$ok" != "1" ]; then
            echo "::error::API on 8091 did not come up"; docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs web laravel-api --tail 60; exit 1
          fi
          curl -sf http://127.0.0.1:8091/status
          ok=0
          for i in $(seq 1 90); do curl -sf -o /dev/null http://127.0.0.1:4200 && ok=1 && break; sleep 3; done
          if [ "$ok" != "1" ]; then
            echo "::error::UI on 4200 did not come up"; docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs angular-ui --tail 60; exit 1
          fi
          echo "UI up"
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-report
          path: playwright-report
          retention-days: 7

  # Nightly health gate. The published report (GitHub Pages, `live-report`
  # branch) comes from a full run against the live deployment instead, where
  # every documented defect reproduces.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check out the application under test
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: sut
      # The upstream web (nginx) image is published arm64-only and crashes on the
      # x86_64 runner (exec format error); QEMU emulation handles it transparently.
      - uses: docker/setup-qemu-action@v3
      - name: Start the application (prebuilt images)
        working-directory: sut
        run: docker compose -f docker-compose.prod.yml up --pull missing -d
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Seed the database
        working-directory: sut
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml exec -T laravel-api php artisan migrate:fresh --seed; then exit 0; fi
            sleep 5
          done
          echo "database seed failed"
          docker compose -f docker-compose.prod.yml logs --tail 80
          exit 1
      - name: Wait for API and UI
        working-directory: sut
        run: |
          ok=0
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8091/status > /dev/null && ok=1 && break; sleep 3; done
          if [ "$ok" != "1" ]; then
            echo "::error::API on 8091 did not come up"; docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs web laravel-api --tail 60; exit 1
          fi
          curl -sf http://127.0.0.1:8091/status
          ok=0
          for i in $(seq 1 90); do curl -sf -o /dev/null http://127.0.0.1:4200 && ok=1 && break; sleep 3; done
          if [ "$ok" != "1" ]; then
            echo "::error::UI on 4200 did not come up"; docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs angular-ui --tail 60; exit 1
          fi
          echo "UI up"
      # Gating run — its exit code fails the job on real regressions.
      # (@visual baselines are platform-specific, generated on macOS, so CI skips them.)
      - name: Full suite (gates the job)
        run: npx playwright test --grep-invert "@visual"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-report
          path: playwright-report
          retention-days: 14
