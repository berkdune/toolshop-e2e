# Toolshop E2E — CI
# - push/PR: hızlı smoke (chromium, ~1 dk)
# - nightly + manuel: tam 122 testlik suite; HTML rapor GitHub Pages'a yayınlanır
# Cron saat başından uzak seçildi: demo DB'si saat başında resetleniyor.
name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '25 1 * * *'
  workflow_dispatch:

jobs:
  smoke:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-report
          path: playwright-report
          retention-days: 7

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-report
          path: playwright-report
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: playwright-report
      - uses: actions/deploy-pages@v4
        if: always()
        id: deployment
